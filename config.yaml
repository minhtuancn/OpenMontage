budget:
  mode: warn
  require_approval_for_new_paid_tool: true
  reserve_pct: 0.1
  single_action_approval_usd: 0.5
  total_usd: 10.0
checkpoint:
  policy: guided
  storage_dir: pipeline
llm:
  max_tokens: 4096
  model: claude-sonnet-4-6
  provider: anthropic
  temperature: 0.7
output:
  default_audio_codec: aac
  default_codec: libx264
  default_crf: 23
  default_format: mp4
  default_fps: 30
  default_resolution: 1920x1080
paths:
  library_dir: library
  output_dir: output
  pipeline_dir: pipeline
  skills_dir: skills
  styles_dir: styles
